name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        # Pinned to a commit for supply-chain safety.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)"
          sudo xcode-select --switch "$xcode"
          sw_vers
          xcodebuild -version
          swift --version

      - name: Trust invariants
        run: scripts/check-trust-invariants.sh

      # --force-resolved-versions builds exactly the revisions pinned in
      # Package.resolved; the next step fails if anything re-resolved them.
      - name: Build
        run: swift build --build-tests --force-resolved-versions

      - name: Test
        run: swift test --force-resolved-versions

      - name: Package.resolved is unchanged
        run: git diff --exit-code -- Package.resolved

      # The build output layout differs between toolchains; ask SwiftPM.
      - name: CLI smoke test
        run: |
          macup="$(swift build --show-bin-path)/macup"
          echo "MACUP=$macup" >> "$GITHUB_ENV"
          "$macup" --help
          "$macup" --version
          "$macup" config path --json
          "$macup" config show
          # Reporting only: this installs no agent. `schedule enable` is
          # deliberately never run in CI.
          "$macup" schedule status
          "$macup" schedule status --json
          # Reading only: `plan` and `doctor` describe and diagnose, and
          # `policy list` and `history` print what is already stored. The one
          # command that changes packages, `macup update`, is never run here.
          "$macup" policy list
          "$macup" policy list --json
          "$macup" history
          "$macup" history --json

      # Planning and diagnosing on the disposable runner. Both describe
      # rather than act, so a non-zero exit (a provider hiccup, or Doctor
      # finding something to say about a CI image) is tolerated; what must
      # hold is that the output is valid schema-1 JSON and that a dry run
      # launched nothing.
      - name: Plan, diagnose, and dry-run on the runner
        run: |
          set +e
          "$MACUP" plan --json > "$RUNNER_TEMP/plan.json"; echo "plan exited $?"
          "$MACUP" doctor --json > "$RUNNER_TEMP/doctor.json"; echo "doctor exited $?"
          "$MACUP" update --dry-run --json > "$RUNNER_TEMP/dry-run.json"; echo "dry run exited $?"
          set -e
          python3 - <<'EOF'
          import json, os
          temp = os.environ["RUNNER_TEMP"]
          plan = json.load(open(temp + "/plan.json"))
          assert plan["schemaVersion"] == 1 and plan["kind"] == "plan", plan["kind"]
          doctor = json.load(open(temp + "/doctor.json"))
          assert doctor["schemaVersion"] == 1 and doctor["kind"] == "doctor", doctor["kind"]
          run = json.load(open(temp + "/dry-run.json"))
          assert run["schemaVersion"] == 1 and run["kind"] == "update", run["kind"]
          # The Phase 2 exit criterion, checked on a real machine: a dry run
          # attempts nothing at all.
          assert run["dryRun"] is True
          assert run["executed"] == [], run["executed"]
          assert run["summary"]["attempted"] == 0, run["summary"]
          print("plan, doctor, and dry run are schema-1 and changed nothing")
          EOF

      # A real, read-only check on the disposable runner. Exit status 2
      # (a provider failed, for example a registry hiccup) is tolerated; the
      # report must still be valid schema-1 JSON containing only read-only
      # commands.
      - name: Read-only check on the runner
        run: |
          set +e
          "$MACUP" check --json > "$RUNNER_TEMP/check.json"
          status=$?
          set -e
          echo "macup check exited with status $status"
          python3 - <<'EOF'
          import json, os
          report = json.load(open(os.environ["RUNNER_TEMP"] + "/check.json"))
          assert report["schemaVersion"] == 1 and report["kind"] == "check"
          assert report["mode"] == "readOnly"
          assert all(command["effect"] == "readOnly" for command in report["commands"])
          print(json.dumps(report["summary"], indent=2))
          EOF
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          "$MACUP" check --verbose || true

      - name: Release build smoke test
        run: |
          swift build -c release --product macup --force-resolved-versions
          "$(swift build -c release --show-bin-path)/macup" --version

      - name: make install smoke test
        run: |
          make install PREFIX="$RUNNER_TEMP/macup"
          "$RUNNER_TEMP/macup/bin/macup" --version
          make uninstall PREFIX="$RUNNER_TEMP/macup"
          test ! -e "$RUNNER_TEMP/macup/bin/macup"
